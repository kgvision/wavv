<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wavv — Library</title>
<script src="support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="spotify.js"></script>
<style>
::-webkit-scrollbar{display:none}
body{margin:0;font-family:'Sweet Sans Pro', 'Helvetica Neue', sans-serif;background:#12161C}
a{color:inherit;text-decoration:none}
html,body{height:100%}
body{background:#12161C}
@media (min-width:600px){body{background:#0A0D11}[data-app]{margin:max(24px, calc((100vh - 844px) / 2)) auto !important;height:844px !important;max-height:calc(100vh - 48px);border-radius:36px;border:1px solid #232B36;box-shadow:0 30px 80px rgba(0,0,0,0.5)}}
</style>
</helmet>
<div data-app="1" style="flex-shrink: 0; width: 100%; max-width: 430px; height: 100dvh; margin: 0 auto; box-sizing: border-box; background: #12161C; color: #E6ECF2; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <div style="padding: 56px 24px 8px; display: flex; flex-direction: column; gap: 2px">
    <div style="font-family: 'Sweet Sans Pro', 'Helvetica Neue', sans-serif; font-weight: 600; font-size: 30px; letter-spacing: -0.5px; color: #E6ECF2">wavv</div>
    <div style="font-size: 13px; color: #8A96A6; display: flex; align-items: center; gap: 6px">
      <svg width="12" height="12" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{ syncColor }}" stroke-width="2.5" stroke-linecap="round"><path d="M20 6L9 17l-5-5"></path></svg>
      {{ syncLabel }}
    </div>
  </div>

  <div style="display: flex; gap: 8px; padding: 20px 24px 4px">
    <button style="font-family: 'Sweet Sans Pro', 'Helvetica Neue', sans-serif; font-size: 14px; font-weight: 600; padding: 9px 16px; border-radius: 20px; border: none; background: #29B6F6; color: #12161C; cursor: pointer">Playlists</button>
    <button style="font-family: 'Sweet Sans Pro', 'Helvetica Neue', sans-serif; font-size: 14px; font-weight: 500; padding: 9px 16px; border-radius: 20px; border: 1px solid #2F3845; background: transparent; color: #B8C3D1; cursor: pointer">Liked</button>
    <button style="font-family: 'Sweet Sans Pro', 'Helvetica Neue', sans-serif; font-size: 14px; font-weight: 500; padding: 9px 16px; border-radius: 20px; border: 1px solid #2F3845; background: transparent; color: #B8C3D1; cursor: pointer">Albums</button>
  </div>

  <div style="flex: 1; overflow-y: auto; scrollbar-width: none; padding: 16px 24px 24px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: center; position: relative">
      <div style="font-size: 17px; font-weight: 600">Playlists</div>
      <button aria-label="Sort" aria-expanded="{{ sortOpen }}" onClick="{{ toggleSort }}" style="font-family: 'Sweet Sans Pro', 'Helvetica Neue', sans-serif; display: flex; align-items: center; gap: 6px; background: none; border: none; color: #B8C3D1; font-size: 13px; font-weight: 500; cursor: pointer; padding: 4px 0">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M6 12h12M10 18h4"></path></svg>
        {{ sortLabel }}
      </button>
      <sc-if value="{{ sortOpen }}" hint-placeholder-val="{{ false }}">
        <div style="position: absolute; right: 0; top: 32px; z-index: 5; min-width: 180px; padding: 6px; border-radius: 12px; background: #1A2029; border: 1px solid #2F3845; box-shadow: 0 12px 32px rgba(0,0,0,0.45); display: flex; flex-direction: column">
          <sc-for list="{{ sortOptions }}" as="o" hint-placeholder-count="4">
            <button onClick="{{ o.pick }}" style="font-family: 'Sweet Sans Pro', 'Helvetica Neue', sans-serif; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px; border-radius: 8px; border: none; background: {{ o.bg }}; color: {{ o.color }}; font-size: 14px; font-weight: 500; text-align: left; cursor: pointer">{{ o.label }}<span style="opacity: {{ o.check }}">✓</span></button>
          </sc-for>
        </div>
      </sc-if>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px 10px">
      <sc-for list="{{ playlists }}" as="p" hint-placeholder-count="4">
        <a href="{{ p.href }}" style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
          <div style="aspect-ratio: 1; border-radius: 10px; background: {{ p.bg }}"></div>
          <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
            <div style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ p.name }}</div>
            <div style="font-size: 12px; color: #8A96A6">{{ p.tracks }}</div>
          </div>
        </a>
      </sc-for>
    </div>
    <div style="font-size: 17px; font-weight: 600; padding-top: 10px">Albums</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px 10px">
      <sc-for list="{{ albums }}" as="al" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
          <div style="aspect-ratio: 1; border-radius: 10px; background: {{ al.bg }}"></div>
          <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
            <div style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ al.name }}</div>
            <div style="font-size: 12px; color: #8A96A6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ al.artist }}</div>
          </div>
        </div>
      </sc-for>
    </div>
    <div style="font-size: 13px; color: #5F6B7A">12 unmatched tracks across your library</div>
  </div>

  <div style="display: flex; justify-content: space-around; align-items: center; padding: 14px 0 28px; border-top: 1px solid #232B36; background: #151A21">
    <button aria-label="Library" style="background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #29B6F6; cursor: pointer">
      <svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="18" rx="1.5"></rect><rect x="14" y="3" width="7" height="10" rx="1.5"></rect></svg>
      <span style="font-size: 11px; font-weight: 600">Library</span>
    </button>
    <a href="Search.dc.html" aria-label="Search" style=" display: flex; flex-direction: column; align-items: center; gap: 4px; color: #7C8898; cursor: pointer">
      <svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
      <span style="font-size: 11px; font-weight: 500">Search</span>
    </a>
    <a href="Visuals.dc.html" aria-label="Visuals" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #7C8898">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10v3M6 6v11M10 3v18M14 8v7M18 5v13M22 10v3"></path></svg>
      <span style="font-size: 11px; font-weight: 500">Visuals</span>
    </a>
    <a href="Sync.dc.html" aria-label="Sync" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #7C8898; cursor: pointer">
      <svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"></path><path d="M3.5 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.65 4.36A9 9 0 0 0 20.5 15"></path></svg>
      <span style="font-size: 11px; font-weight: 500">Sync</span>
    </a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
state = { sort: 'recent', sortOpen: false, lib: null };
componentDidMount() {
  const load = () => window.WavvSpotify ? this.setState({ lib: window.WavvSpotify.library() }) : setTimeout(load, 30);
  load();
}
renderVals() {
const playlists = [
  { name: 'Late Night Drives', n: 32, added: 4, tracks: '32 tracks', href: 'Player.dc.html', bg: 'linear-gradient(160deg,#29B6F6,#1E4E8C)' },
  { name: 'Sunday Kitchen', n: 18, added: 2, tracks: '18 tracks', bg: 'linear-gradient(160deg,#6B8F71,#3E5D45)' },
  { name: 'Focus — Instrumentals', n: 64, added: 3, tracks: '64 tracks', bg: 'linear-gradient(160deg,#7C8FB0,#4A5A78)' },
  { name: 'Road Trip 2024', n: 41, added: 1, tracks: '41 tracks', bg: 'linear-gradient(160deg,#B0708F,#78415A)' }
];
const albums = [
  { name: 'Bon Iver, Bon Iver', n: 10, added: 6, artist: 'Bon Iver', bg: 'linear-gradient(160deg,#8FA3B8,#3A4A5C)' },
  { name: 'In Rainbows', n: 10, added: 5, artist: 'Radiohead', bg: 'linear-gradient(160deg,#5A7FA0,#1E2F45)' },
  { name: 'Currents', n: 13, added: 4, artist: 'Tame Impala', bg: 'linear-gradient(160deg,#7A6FB0,#3A2F6B)' },
  { name: 'Blonde', n: 17, added: 3, artist: 'Frank Ocean', bg: 'linear-gradient(160deg,#9AB0A8,#44605A)' },
  { name: 'Carrie & Lowell', n: 11, added: 2, artist: 'Sufjan Stevens', bg: 'linear-gradient(160deg,#6C8CA8,#2C4058)' },
  { name: 'Titanic Rising', n: 10, added: 1, artist: 'Weyes Blood', bg: 'linear-gradient(160deg,#4F8FB8,#1B3550)' }
];
const lib = this.state.lib;
const cover = (it, i) => it.image ? `center / cover no-repeat url("${it.image}")` : ['linear-gradient(160deg,#29B6F6,#1E4E8C)','linear-gradient(160deg,#6B8F71,#3E5D45)','linear-gradient(160deg,#7C8FB0,#4A5A78)','linear-gradient(160deg,#B0708F,#78415A)'][i % 4];
if (lib) {
  playlists.length = 0; albums.length = 0;
  lib.playlists.forEach((p, i) => playlists.push({ name: p.name, n: p.n, added: p.added, tracks: p.n + ' tracks', href: i === 0 ? 'Player.dc.html' : p.url, bg: cover(p, i) }));
  lib.albums.forEach((a, i) => albums.push({ name: a.name, artist: a.artist, n: a.n, added: a.added, bg: cover(a, i + 1) }));
}
const opts = [
  { id: 'recent', label: 'Recently added', cmp: (a, b) => b.added - a.added },
  { id: 'az', label: 'A–Z', cmp: (a, b) => a.name.localeCompare(b.name) },
  { id: 'za', label: 'Z–A', cmp: (a, b) => b.name.localeCompare(a.name) },
  { id: 'tracks', label: 'Most tracks', cmp: (a, b) => b.n - a.n }
];
const cur = opts.find(o => o.id === this.state.sort) || opts[0];
return {
  playlists: [...playlists].sort(cur.cmp),
  albums: [...albums].sort(cur.cmp),
  sortLabel: cur.label,
  syncLabel: lib ? 'Synced from Spotify · ' + window.WavvSpotify.ago(lib.syncedAt) : 'Not connected · Tap Sync to connect Spotify',
  syncColor: lib ? '#4CA870' : '#5F6B7A',
  sortOpen: this.state.sortOpen,
  toggleSort: () => this.setState(s => ({ sortOpen: !s.sortOpen })),
  sortOptions: opts.map(o => ({
    label: o.label,
    check: o.id === cur.id ? 1 : 0,
    bg: o.id === cur.id ? '#232B36' : 'transparent',
    color: o.id === cur.id ? '#29B6F6' : '#E6ECF2',
    pick: () => this.setState({ sort: o.id, sortOpen: false })
  }))
};
}
}
</script>


</body></html>
